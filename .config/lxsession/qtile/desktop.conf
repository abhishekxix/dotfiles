[GTK]
sNet/ThemeName=Yaru-purple-dark
sGtk/FontName=Ubuntu 11
sGtk/ColorScheme=
sNet/IconThemeName=Papirus-Dark
sGtk/CursorThemeName=breeze_cursors
iGtk/CursorThemeSize=16
iGtk/ToolbarStyle=3
iGtk/ToolbarIconSize=3
iGtk/ButtonImages=1
iGtk/MenuImages=0
iNet/EnableEventSounds=0
iNet/EnableInputFeedbackSounds=0
iXft/Antialias=1
iXft/Hinting=1
sXft/HintStyle=hintslight
sXft/RGBA=rgb

[Session]
# Qtile's autostart.sh owns picom, xbindkeys, flameshot, dunst,
# volumeicon, copyq, nm-applet, blueman-applet, and xscreensaver.
# GNOME Keyring (via ~/.xsessionrc) owns SSH keys and secrets.
disable_autostart=yes
polkit/command=lxpolkit
clipboard/command=lxclipboard
xsettings_manager/command=build-in
proxy_manager/command=build-in
keyring/command=
quit_manager/command=lxsession-logout
lock_manager/command=lxlock
terminal_manager/command=lxterminal
quit_manager/image=/usr/share/lxde/images/logout-banner.png
quit_manager/layout=top

[Mouse]
AccFactor=20
AccThreshold=10
LeftHanded=0

[Keyboard]
Delay=500
Interval=30
Beep=1

[State]
guess_default=true

[Dbus]
lxde=true

[Environment]
menu_prefix=lxde-
