# home/.xprofile sets XDG_CURRENT_DESKTOP=GNOME (for GNOME Keyring in Electron),
# which makes xdg-desktop-portal pick the GNOME backend. That backend needs
# GNOME Shell and hangs under qtile, so apps never receive the dark
# color-scheme. Route everything to the GTK backend instead.
[preferred]
default=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
