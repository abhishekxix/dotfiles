# home/.xprofile sets XDG_CURRENT_DESKTOP=GNOME (for GNOME Keyring in Electron),
# which makes xdg-desktop-portal pick the GNOME backend. That backend needs
# GNOME Shell and hangs under qtile, so apps never receive the dark
# color-scheme. Route everything to the GTK backend instead.
[preferred]
default=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
# Interfaces only the GNOME backend implements: disable them explicitly,
# otherwise the portal falls back to GNOME via UseIn, each one blocks for
# the 25s D-Bus timeout, and systemd kills the service before it starts.
org.freedesktop.impl.portal.Background=none
org.freedesktop.impl.portal.Clipboard=none
org.freedesktop.impl.portal.GlobalShortcuts=none
org.freedesktop.impl.portal.InputCapture=none
org.freedesktop.impl.portal.RemoteDesktop=none
org.freedesktop.impl.portal.ScreenCast=none
org.freedesktop.impl.portal.Screenshot=none
org.freedesktop.impl.portal.Usb=none
org.freedesktop.impl.portal.Wallpaper=none
