# Shared manifest-schema gate: local git hook + CI (see
# .github/workflows/validate.yml) both run `pre-commit run --all-files`.
# Install the hook once with:  pre-commit install
repos:
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
      - id: check-jsonschema
        name: packages.json vs packages.schema.json
        files: ^ansible/vars/packages\.json$
        args: ["--schemafile", "ansible/vars/packages.schema.json"]
      - id: check-jsonschema
        name: package-deps.json vs package-deps.schema.json
        files: ^ansible/vars/package-deps\.json$
        args: ["--schemafile", "ansible/vars/package-deps.schema.json"]
