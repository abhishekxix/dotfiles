# Shared manifest gate: local git hook + CI (see
# .github/workflows/validate.yml) both run `pre-commit run --all-files`.
# .bin/validate-manifest.py is stdlib-only and the same validator the
# ansible preflight runs; the *.schema.json files remain as editor $schema
# hints. Install the hook once with:  pre-commit install
repos:
  - repo: local
    hooks:
      - id: validate-manifests
        name: ansible/vars manifests vs .bin/validate-manifest.py
        entry: .bin/validate-manifest.py
        language: system
        pass_filenames: false
        # Validator/hook changes must trigger the gate too, not only JSON.
        files: ^(ansible/vars/(packages|package-deps|repos|flatpak-remotes)\.json|\.bin/validate-manifest\.py|\.pre-commit-config\.yaml)$
