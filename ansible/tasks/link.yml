---
# Shared stat/backup/link unit. Included per entry with link_source,
# link_destination, link_backup_group (home|config).
#
# 09-19: dotfiles_link_conflict is the single conflict fact consumed by every
# task below (previously the same 4-line `when` was copy-pasted 6x). Logic is
# byte-identical: "destination exists (or is a link) AND is not already the
# managed symlink". Check-mode behavior is unchanged (AI-09): real
# mkdir/mv/link steps are skipped and debug predict-tasks report instead.
- name: Inspect {{ link_destination }}
  ansible.builtin.stat:
      path: '{{ link_destination }}'
      follow: false
  register: link_destination_stat

- name: Evaluate link conflict for {{ link_destination }}
  ansible.builtin.set_fact:
      dotfiles_link_conflict: "{{ (link_destination_stat.stat.exists or (link_destination_stat.stat.islnk | default(false))) and not (link_destination_stat.stat.islnk | default(false) and link_destination_stat.stat.lnk_source == link_source) }}"

- name: Stop before replacing {{ link_destination }}
  ansible.builtin.fail:
      msg: >-
          {{ link_destination }} already exists and is not the managed symlink.
          Move it manually or set dotfiles_backup_conflicts to true.
  when:
      - dotfiles_link_conflict | bool
      - not dotfiles_backup_conflicts | bool

- name: Create backup directory for {{ link_destination }}
  ansible.builtin.file:
      path: '{{ dotfiles_backup_root }}/{{ link_backup_group }}'
      state: directory
      mode: '0700'
  when:
      - dotfiles_link_conflict | bool
      # AI-09: in check mode the mv below never runs, so predict the backup dir.
      - not ansible_check_mode

- name: Predict backup directory for {{ link_destination }}
  ansible.builtin.debug:
      msg: "Would create backup directory {{ dotfiles_backup_root }}/{{ link_backup_group }}"
  changed_when: true
  when:
      - dotfiles_link_conflict | bool
      - ansible_check_mode

- name: Back up {{ link_destination }}
  ansible.builtin.command:
      argv:
          - mv
          - --
          - '{{ link_destination }}'
          - '{{ dotfiles_backup_root }}/{{ link_backup_group }}/'
  when:
      - dotfiles_link_conflict | bool
      - not ansible_check_mode
  # AI-09: the mv module reports changed; check_mode skips execution.

- name: Predict back up of {{ link_destination }}
  ansible.builtin.debug:
      msg: "Would move {{ link_destination }} to {{ dotfiles_backup_root }}/{{ link_backup_group }}/"
  changed_when: true
  when:
      - dotfiles_link_conflict | bool
      - ansible_check_mode

- name: Predict link {{ link_destination }}
  ansible.builtin.debug:
      msg: "Would link {{ link_destination }} -> {{ link_source }} (after backing up conflict)"
  changed_when: true
  when:
      - ansible_check_mode
      - dotfiles_link_conflict | bool

- name: Link {{ link_destination }}
  ansible.builtin.file:
      src: '{{ link_source }}'
      dest: '{{ link_destination }}'
      state: link
      force: false
  # AI-09: in check mode the mv above never runs, so the conflicting file is
  # still in place and force=false would fail instead of predicting. Skip the
  # real link in that case; the predict task above reports the change.
  when: not (ansible_check_mode and (dotfiles_link_conflict | bool))
  register: dotfiles_link_result
  failed_when: false

- name: Restore backup after failed link of {{ link_destination }}
  ansible.builtin.command:
      argv:
          - mv
          - -n
          - '{{ dotfiles_backup_root }}/{{ link_backup_group }}/{{ link_destination | basename }}'
          - '{{ link_destination }}'
  when:
      - dotfiles_link_conflict | bool
      - not ansible_check_mode
      - dotfiles_link_result is failed

- name: Fail when link of {{ link_destination }} failed
  ansible.builtin.fail:
      msg: "Linking {{ link_destination }} failed; backup restored when present (mv -n never overwrites a new file)."
  when:
      - not ansible_check_mode
      - dotfiles_link_result is failed
