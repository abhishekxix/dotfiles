---
# Expects `pkg` ({key, value} for one archive entry). Pre-hook, extract, post-hook.
- name: Pre-hook for archive
  ansible.builtin.include_tasks: tasks/hook-one.yml
  vars:
    hook_key: "{{ pkg.key }}"
    hook_phase: pre

- name: Extract archive
  ansible.builtin.unarchive:
    # AI-23: per-arch URL override (e.g. url_arm64), else the default url.
    src: "{{ pkg.value['url_' + dotfiles_deb_arch] | default(pkg.value.url, true) }}"
    dest: "{{ pkg.value.dest | regex_replace('^~/', dotfiles_home + '/') }}"
    remote_src: true
    creates: "{{ pkg.value.creates | regex_replace('^~/', dotfiles_home + '/') }}"
    # AI-20/AI-32: strip-components is tar-only; never passed for .zip
    # (case-insensitive, query-string tolerant). 09-14: test the same
    # resolved per-arch URL that src: downloads, not the base url.
    extra_opts: "{{ ['--strip-components=' + (pkg.value.strip | string)] if (pkg.value.strip is defined and (pkg.value['url_' + dotfiles_deb_arch] | default(pkg.value.url, true)) is not search('(?i)\\.zip($|\\?)')) else [] }}"

- name: Post-hook for archive
  ansible.builtin.include_tasks: tasks/hook-one.yml
  vars:
    hook_key: "{{ pkg.key }}"
    hook_phase: post
