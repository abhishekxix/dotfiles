---
# -- Package installer hooks (pre) --------------------------------------
# Convention: ansible/hooks/<key>.pre[.root].<sh|py>. See hooks/README.md.
- name: Discover pre-install hooks
  ansible.builtin.set_fact:
    dotfiles_pre_hooks: "{{ query('ansible.builtin.fileglob', (test_hooks_dir | default(playbook_dir + '/hooks')) + '/*.pre.*') }}"
    dotfiles_selected_keys: "{{ dotfiles_packages_selected | map(attribute='key') | list }}"
  tags:
    - packages

- name: Run global pre-install hook
  ansible.builtin.script: "{{ item }}"
  loop: "{{ dotfiles_pre_hooks | select('search', '/global\\.pre\\.') | list }}"
  environment:
    DOTFILES_USER: "{{ ansible_user_id }}"
  changed_when: false
  tags:
    - packages

- name: Run per-package pre-install hooks
  ansible.builtin.script: "{{ item }}"
  loop: "{{ dotfiles_pre_hooks | reject('search', '/global\\.pre\\.') | reject('search', '\\.root\\.') | list }}"
  when: (item | basename).split('.') | first in dotfiles_selected_keys
  environment:
    DOTFILES_USER: "{{ ansible_user_id }}"
  changed_when: false
  tags:
    - packages

- name: Run per-package pre-install hooks (root)
  ansible.builtin.script: "{{ item }}"
  loop: "{{ dotfiles_pre_hooks | reject('search', '/global\\.pre\\.') | select('search', '\\.root\\.') | list }}"
  when: (item | basename).split('.') | first in dotfiles_selected_keys
  become: true
  environment:
    DOTFILES_USER: "{{ ansible_user_id }}"
  changed_when: false
  tags:
    - packages
