---
# Expects `pkg` ({key, value} for one script entry). Pre-hook, install, post-hook.
- name: Pre-hook for script installer
  ansible.builtin.include_tasks: tasks/hook-one.yml
  vars:
    hook_key: "{{ pkg.key }}"
    hook_phase: pre

- name: Run script installer
  ansible.builtin.shell:
    # 09-19: fnm ships via the toolchain bootstrap above, which is the
    # single source of truth.
    # 09-09: the pipe target is per-entry (default bash) — starship's
    # installer aborts under bash, so it overrides to sh.
    # 09-09: leading ~/ in args is expanded (quoting suppresses shell
    # tilde expansion), mirroring the creates expansion below.
    # 09-09: deliberately no `creates:` guard — these installers track
    # upstream latest and self-manage reruns (starship reinstalls,
    # opencode exits 0 when current), so a guard would freeze the
    # first-installed version forever. `creates` stays in the manifest
    # for the link task.
    cmd: "set -o pipefail && curl -fsSL {{ pkg.value.url | quote }} | {{ pkg.value.interpreter | default('bash', true) }} -s -- {{ pkg.value.args | default([]) | map('regex_replace', '^~/', dotfiles_home + '/') | map('quote') | join(' ') }}"
    executable: /bin/bash
  environment:
    PATH: "{{ dotfiles_home }}/.local/bin:{{ dotfiles_home }}/.cargo/bin:/usr/local/bin:/usr/bin:/bin"

- name: Post-hook for script installer
  ansible.builtin.include_tasks: tasks/hook-one.yml
  vars:
    hook_key: "{{ pkg.key }}"
    hook_phase: post
