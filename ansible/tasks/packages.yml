---
# -- Per-source installs ------------------------------------------------
# cache_valid_time drops to 0 when tasks/components.yml changed the apt
# components or migrated legacy sources — otherwise a <1h-old cache (e.g.
# the migration's own validation update, or a just-failed run on a fresh
# host) would skip the refresh and the new/third-party indexes would never
# load.
- name: Update APT package metadata
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ 0 if (dotfiles_components_result.changed | default(false) or dotfiles_sources_migrated.changed | default(false)) else 3600 }}"
  tags:
    - packages

# AI-17: one task, one apt transaction for all selected apt packages.
- name: Install apt packages
  become: true
  ansible.builtin.apt:
    name: "{{ dotfiles_pkgs_apt | map(attribute='value.package') | list }}"
    state: present
  when: (dotfiles_pkgs_apt | length) > 0
  tags:
    - packages

# 09-23: build deps must land before any per-source install/build task
# below (git build steps in particular). One apt transaction.
- name: Install build dependencies
  become: true
  ansible.builtin.apt:
    name: "{{ dotfiles_deps_apt }}"
    state: present
  when: (dotfiles_deps_apt | length) > 0
  tags:
    - packages

# Per-package pre/post hooks wrap these loops via install-*-one.yml: each
# entry runs pre-hook, install, post-hook in order (see hooks/README.md).
- name: Install cargo crates
  ansible.builtin.include_tasks:
    file: tasks/install-cargo-one.yml
    apply:
      tags:
        - packages
  loop: "{{ dotfiles_pkgs_cargo }}"
  loop_control:
    loop_var: pkg
    label: "{{ pkg.value.crate }}"
  tags:
    - packages

- name: Install global npm packages
  ansible.builtin.include_tasks:
    file: tasks/install-npm-one.yml
    apply:
      tags:
        - packages
  loop: "{{ dotfiles_pkgs_npm }}"
  loop_control:
    loop_var: pkg
    label: "{{ pkg.value.package }}"
  tags:
    - packages

- name: Run script installers
  ansible.builtin.include_tasks:
    file: tasks/install-script-one.yml
    apply:
      tags:
        - packages
  loop: "{{ dotfiles_pkgs_script }}"
  loop_control:
    loop_var: pkg
    label: "{{ pkg.key }}"
  tags:
    - packages

# script entries with `link` expose the installed binary on PATH via
# ~/.local/bin (the script source has no dest; the install root is the
# creates file's directory — e.g. opencode's installer hardcodes
# ~/.opencode/bin).
- name: Ensure ~/.local/bin exists for script links
  ansible.builtin.file:
    path: "{{ dotfiles_home }}/.local/bin"
    state: directory
    mode: "0755"
  when: (dotfiles_pkgs_script | selectattr('value.link', 'defined') | list | length) > 0
  tags:
    - packages

- name: Link script binaries into ~/.local/bin
  ansible.builtin.file:
    # force so a reinstalled/retargeted binary relinks instead of failing.
    src: "{{ ((item.value.creates | regex_replace('^~/', dotfiles_home + '/') | ansible.builtin.dirname) ~ '/' ~ item.value.link) }}"
    path: "{{ dotfiles_home }}/.local/bin/{{ item.value.link | basename }}"
    state: link
    force: true
  loop: "{{ dotfiles_pkgs_script | selectattr('value.link', 'defined') | list }}"
  loop_control:
    label: "{{ item.key }}"
  tags:
    - packages

# AI-21: the per-user deb cache dir must exist before get_url writes into it.
- name: Ensure deb download cache directory exists
  ansible.builtin.file:
    path: "{{ dotfiles_home }}/.cache/dotfiles-debs"
    state: directory
    mode: "0755"
  when: (dotfiles_pkgs_deb | length) > 0
  tags:
    - packages

- name: Download and install deb packages
  ansible.builtin.include_tasks:
    file: tasks/install-deb-one.yml
    apply:
      tags:
        - packages
  loop: "{{ dotfiles_pkgs_deb }}"
  loop_control:
    loop_var: pkg
    label: "{{ pkg.key }}"
  tags:
    - packages

- name: Ensure archive parents exist
  ansible.builtin.file:
    path: "{{ item.value.dest | regex_replace('^~/', dotfiles_home + '/') }}"
    state: directory
    mode: "0755"
  loop: "{{ dotfiles_pkgs_archive }}"
  loop_control:
    label: "{{ item.key }}"
  when: (item.value.creates | regex_replace('^~/', dotfiles_home + '/')) != (item.value.dest | regex_replace('^~/', dotfiles_home + '/'))
  tags:
    - packages

# 09-21: base `url` is the amd64 default; any other arch must define
# `url_<arch>` — silently fetching the x86_64 binary on armhf/i386 would
# fail obscurely at extract/run time, so fail fast instead.
- name: Validate archive per-arch URLs
  ansible.builtin.assert:
    that:
      - dotfiles_deb_arch == 'amd64' or item.value['url_' + dotfiles_deb_arch] is defined
    fail_msg: "No {{ dotfiles_deb_arch }} URL for archive '{{ item.key }}': add url_{{ dotfiles_deb_arch }} (base url is amd64-only)."
    quiet: true
  loop: "{{ dotfiles_pkgs_archive }}"
  loop_control:
    label: "{{ item.key }}"
  when: dotfiles_deb_arch != 'amd64'
  tags:
    - packages

- name: Extract archives
  ansible.builtin.include_tasks:
    file: tasks/install-archive-one.yml
    apply:
      tags:
        - packages
  loop: "{{ dotfiles_pkgs_archive }}"
  loop_control:
    loop_var: pkg
    label: "{{ pkg.key }}"
  tags:
    - packages

# 09-22: archive entries with `link` expose a binary from inside the
# extracted tree on PATH via ~/.local/bin (e.g. nvim tarballs ship a
# bin/nvim deep in a full directory layout).
- name: Ensure ~/.local/bin exists for archive links
  ansible.builtin.file:
    path: "{{ dotfiles_home }}/.local/bin"
    state: directory
    mode: "0755"
  when: (dotfiles_pkgs_archive | selectattr('value.link', 'defined') | list | length) > 0
  tags:
    - packages

- name: Link archive binaries into ~/.local/bin
  ansible.builtin.file:
    # force so a bumped URL/dest retargets the existing symlink instead of failing.
    src: "{{ (item.value.dest ~ '/' ~ item.value.link) | regex_replace('^~/', dotfiles_home + '/') }}"
    path: "{{ dotfiles_home }}/.local/bin/{{ item.value.link | basename }}"
    state: link
    force: true
  loop: "{{ dotfiles_pkgs_archive | selectattr('value.link', 'defined') | list }}"
  loop_control:
    label: "{{ item.key }}"
  tags:
    - packages

# AI-25: ansible.builtin.git has no `creates` param — guard the clone with
# a stat of the entry's `creates` marker instead (skip_missing-safe via
# the index-matched register).
- name: Check git install markers
  ansible.builtin.stat:
    path: "{{ item.value.creates | regex_replace('^~/', dotfiles_home + '/') }}"
  loop: "{{ dotfiles_pkgs_git }}"
  loop_control:
    label: "{{ item.key }}"
    index_var: dotfiles_git_idx
  register: dotfiles_git_marker
  tags:
    - packages

- name: Clone git sources and run build steps
  ansible.builtin.include_tasks:
    file: tasks/install-git-one.yml
    apply:
      tags:
        - packages
  loop: "{{ dotfiles_pkgs_git }}"
  loop_control:
    loop_var: pkg
    label: "{{ pkg.key }}"
    index_var: dotfiles_git_idx
  vars:
    git_marker: "{{ dotfiles_git_marker.results[dotfiles_git_idx] }}"
  tags:
    - packages

# -- Flatpak (system-level; remotes must exist before applications) ------
- name: Ensure flatpak remotes (system)
  become: true
  community.general.flatpak_remote:
    name: "{{ item }}"
    flatpakrepo_url: "{{ dotfiles_flatpak_remotes_manifest[item].url }}"
    state: present
    method: system
  loop: "{{ dotfiles_flatpak_remotes_selected }}"
  loop_control:
    label: "{{ item }}"
  tags:
    - packages

- name: Install flatpak applications
  ansible.builtin.include_tasks:
    file: tasks/install-flatpak-one.yml
    apply:
      tags:
        - packages
  loop: "{{ dotfiles_pkgs_flatpak }}"
  loop_control:
    loop_var: pkg
    label: "{{ pkg.value.package }}"
  tags:
    - packages

