---
- name: Configure local machine (Debian stable)
  hosts: localhost
  gather_facts: true

  vars:
      dotfiles_profile: workstation
      dotfiles_backup_conflicts: true
      dotfiles_config_excludes:
          - README.md
      dotfiles_repo_root: "{{ playbook_dir | ansible.builtin.dirname }}"
      dotfiles_home: '{{ ansible_facts.user_dir }}'
      dotfiles_backup_root: "{{ ansible_facts.user_dir }}/.local/state/dotfiles/backups/{{ ansible_date_time.iso8601_basic_short }}"
      dotfiles_manifest: "{{ lookup('ansible.builtin.file', playbook_dir + '/vars/packages.json') | from_json }}"
      dotfiles_repos_manifest: "{{ lookup('ansible.builtin.file', playbook_dir + '/vars/repos.json') | from_json }}"
      dotfiles_packages_selected: "{{ dotfiles_manifest | dict2items | selectattr('value.profiles', 'contains', dotfiles_profile) | list }}"
      dotfiles_repos_selected: "{{ dotfiles_packages_selected | selectattr('value.source', 'equalto', 'apt') | selectattr('value.repo', 'defined') | map(attribute='value.repo') | unique | list }}"
      dotfiles_pkgs_apt: "{{ dotfiles_packages_selected | selectattr('value.source', 'equalto', 'apt') | list }}"
      dotfiles_pkgs_cargo: "{{ dotfiles_packages_selected | selectattr('value.source', 'equalto', 'cargo') | list }}"
      dotfiles_pkgs_npm: "{{ dotfiles_packages_selected | selectattr('value.source', 'equalto', 'npm') | list }}"
      dotfiles_pkgs_pipx: "{{ dotfiles_packages_selected | selectattr('value.source', 'equalto', 'pipx') | list }}"
      dotfiles_pkgs_script: "{{ dotfiles_packages_selected | selectattr('value.source', 'equalto', 'script') | list }}"
      dotfiles_pkgs_deb: "{{ dotfiles_packages_selected | selectattr('value.source', 'equalto', 'deb') | list }}"
      dotfiles_pkgs_archive: "{{ dotfiles_packages_selected | selectattr('value.source', 'equalto', 'archive') | list }}"
      dotfiles_pkgs_git: "{{ dotfiles_packages_selected | selectattr('value.source', 'equalto', 'git') | list }}"
      # AI-01/AI-27: map kernel arch names to Debian apt arch names; anything
      # unmapped fails fast in validation instead of writing a broken arch= line.
      dotfiles_deb_arch_map:
          x86_64: amd64
          aarch64: arm64
          armv7l: armhf
          i386: i386
          i686: i386
      dotfiles_deb_arch: "{{ dotfiles_deb_arch_map[ansible_facts.architecture] | default('UNKNOWN:' + ansible_facts.architecture, true) }}"

  tasks:
      # -- Manifest validation (fail fast on schema violations; AI-07) -------
      - name: Validate package manifest schema
        ansible.builtin.assert:
            that:
                - dotfiles_manifest is mapping
                - dotfiles_manifest.values() | selectattr('source', 'undefined') | length == 0
                - dotfiles_manifest.values() | map(attribute='source') | reject('in', ['apt', 'cargo', 'npm', 'pipx', 'script', 'deb', 'archive', 'git']) | length == 0
                - dotfiles_manifest.values() | selectattr('profiles', 'undefined') | length == 0
                - dotfiles_manifest.values() | map(attribute='profiles') | select('equalto', []) | length == 0
                - dotfiles_manifest.values() | map(attribute='profiles') | flatten | difference(['workstation', 'server']) | length == 0
                # AI-27: unknown arches must not silently become a broken arch= line.
                - not (dotfiles_deb_arch is search('^UNKNOWN:'))
                # AI-29: minimal type checks so malformed entries fail fast.
                - dotfiles_manifest.values() | selectattr('source', 'equalto', 'script') | selectattr('args', 'defined') | rejectattr('args', 'sequence') | length == 0
                - dotfiles_manifest.values() | selectattr('source', 'equalto', 'archive') | selectattr('strip', 'defined') | rejectattr('strip', 'number') | length == 0
                - dotfiles_manifest.values() | selectattr('source', 'equalto', 'git') | selectattr('build', 'defined') | rejectattr('build', 'sequence') | length == 0
                - dotfiles_manifest.values() | selectattr('source', 'equalto', 'apt') | rejectattr('package', 'defined') | length == 0
                - dotfiles_manifest.values() | selectattr('source', 'equalto', 'cargo') | rejectattr('crate', 'defined') | length == 0
                - dotfiles_manifest.values() | selectattr('source', 'equalto', 'npm') | rejectattr('package', 'defined') | length == 0
                - dotfiles_manifest.values() | selectattr('source', 'equalto', 'pipx') | rejectattr('package', 'defined') | length == 0
                - dotfiles_manifest.values() | selectattr('source', 'equalto', 'script') | rejectattr('url', 'defined') | length == 0
                - dotfiles_manifest.values() | selectattr('source', 'equalto', 'script') | rejectattr('creates', 'defined') | length == 0
                - dotfiles_manifest.values() | selectattr('source', 'equalto', 'deb') | rejectattr('url', 'defined') | length == 0
                - dotfiles_manifest.values() | selectattr('source', 'equalto', 'archive') | rejectattr('url', 'defined') | length == 0
                - dotfiles_manifest.values() | selectattr('source', 'equalto', 'archive') | rejectattr('dest', 'defined') | length == 0
                - dotfiles_manifest.values() | selectattr('source', 'equalto', 'archive') | rejectattr('creates', 'defined') | length == 0
                - dotfiles_manifest.values() | selectattr('source', 'equalto', 'git') | rejectattr('repo', 'defined') | length == 0
                - dotfiles_manifest.values() | selectattr('source', 'equalto', 'git') | rejectattr('build', 'defined') | length == 0
                - dotfiles_manifest.values() | selectattr('source', 'equalto', 'git') | rejectattr('creates', 'defined') | length == 0
                - dotfiles_manifest.values() | selectattr('source', 'equalto', 'apt') | selectattr('repo', 'defined') | rejectattr('repo', 'in', dotfiles_repos_manifest.keys() | list) | length == 0
            fail_msg: "Invalid package manifest: unknown source, bad profile, missing per-source field, or unknown repo id."
            quiet: true
        tags:
            - packages
            - dotfiles

      # -- Toolchain prerequisites (AI-11: before any gpg/dearmor use) --------
      - name: Ensure keyring prerequisites are installed
        become: true
        ansible.builtin.apt:
            name:
                - gnupg
                - ca-certificates
            state: present
            update_cache: true
            cache_valid_time: 3600
        when: (dotfiles_repos_selected | length) > 0
        tags:
            - packages

      # -- Third-party apt repos (referenced only, step 02) -------------------
      - name: Download third-party apt signing keys
        become: true
        ansible.builtin.get_url:
            url: '{{ dotfiles_repos_manifest[item].key_url }}'
            dest: '{{ dotfiles_repos_manifest[item].keyring }}.asc'
            mode: '0644'
        loop: '{{ dotfiles_repos_selected }}'
        when: dotfiles_repos_manifest[item].key_url is defined
        register: dotfiles_key_download
        tags:
            - packages

      - name: Dearmor third-party apt signing keys
        become: true
        ansible.builtin.command:
            argv:
                - gpg
                - --batch
                - --yes
                - --dearmor
                - -o
                - '{{ dotfiles_repos_manifest[item].keyring }}'
                - '{{ dotfiles_repos_manifest[item].keyring }}.asc'
            args:
                creates: '{{ dotfiles_repos_manifest[item].keyring }}'
        loop: '{{ dotfiles_repos_selected }}'
        when: dotfiles_repos_manifest[item].key_url is defined
        register: dotfiles_key_dearmor
        tags:
            - packages

      - name: Remove stale downloaded key copies
        become: true
        ansible.builtin.file:
            path: '{{ dotfiles_repos_manifest[item].keyring }}.asc'
            state: absent
        loop: '{{ dotfiles_repos_selected }}'
        when: dotfiles_repos_manifest[item].key_url is defined
        tags:
            - packages

      - name: Ensure third-party keyring permissions
        become: true
        ansible.builtin.file:
            path: '{{ dotfiles_repos_manifest[item].keyring }}'
            state: file
            mode: '0644'
        loop: '{{ dotfiles_repos_selected }}'
        when: dotfiles_repos_manifest[item].key_url is defined
        tags:
            - packages

      - name: Add third-party apt repositories
        become: true
        ansible.builtin.apt_repository:
            # AI-01: expand the Debian arch (amd64/arm64), not the kernel arch (x86_64/aarch64).
            repo: "{{ dotfiles_repos_manifest[item].repo | replace('{{ ansible_architecture }}', dotfiles_deb_arch) | replace('{{ ansible_distribution_release }}', ansible_facts.distribution_release) }}"
            filename: '{{ item }}'
            state: present
        loop: '{{ dotfiles_repos_selected }}'
        register: dotfiles_repo_add
        tags:
            - packages

      - name: Update APT metadata after adding third-party repos
        become: true
        ansible.builtin.apt:
            update_cache: true
            cache_valid_time: 3600
        # AI-03: only refresh when a key or repo actually changed.
        when: dotfiles_key_download is changed or dotfiles_key_dearmor is changed or dotfiles_repo_add is changed
        tags:
            - packages

      # -- Toolchain bootstrap (auto, gated on selected sources) --------------
      - name: Check for cargo
        ansible.builtin.command:
            argv: [cargo, --version]
        register: dotfiles_cargo_check
        changed_when: false
        failed_when: false
        when: (dotfiles_pkgs_cargo | length) > 0
        tags:
            - packages

      - name: Install rustup (cargo provider)
        ansible.builtin.shell:
            cmd: "set -o pipefail && curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
            executable: /bin/bash
            creates: "{{ dotfiles_home }}/.cargo/bin/cargo"
        when:
            - (dotfiles_pkgs_cargo | length) > 0
            - dotfiles_cargo_check.rc | default(0) != 0
        tags:
            - packages

      - name: Check for fnm
        ansible.builtin.stat:
            path: "{{ dotfiles_home }}/.local/share/fnm/fnm"
        register: dotfiles_fnm_check
        when: (dotfiles_pkgs_npm | length) > 0
        tags:
            - packages

      # AI-30: fnm may already be on PATH (e.g. cargo-installed) even when the
      # stock install path above is absent — probe PATH too so we don't reinstall.
      - name: Check PATH for fnm
        ansible.builtin.command:
            argv: [fnm, --version]
        register: dotfiles_fnm_path_check
        changed_when: false
        failed_when: false
        when: (dotfiles_pkgs_npm | length) > 0
        tags:
            - packages

      - name: Install fnm (node provider)
        ansible.builtin.shell:
            cmd: "set -o pipefail && curl -fsSL https://fnm.vercel.app/install | bash -s -- --skip-shell"
            executable: /bin/bash
            creates: "{{ dotfiles_home }}/.local/share/fnm/fnm"
        environment:
            PATH: "{{ dotfiles_home }}/.local/bin:{{ dotfiles_home }}/.cargo/bin:/usr/local/bin:/usr/bin:/bin"
        when:
            - (dotfiles_pkgs_npm | length) > 0
            - not (dotfiles_fnm_check.stat.exists | default(false))
            - dotfiles_fnm_path_check.rc | default(0) != 0
        tags:
            - packages

      - name: Install Node LTS via fnm
        ansible.builtin.shell:
            cmd: 'set -o pipefail && eval "$({{ dotfiles_home }}/.local/share/fnm/fnm env --shell bash)" && fnm install --lts && fnm alias "$(fnm current)" default'
            executable: /bin/bash
            creates: "{{ dotfiles_home }}/.local/share/fnm/aliases/default"
        environment:
            PATH: "{{ dotfiles_home }}/.local/share/fnm:{{ dotfiles_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
        when: (dotfiles_pkgs_npm | length) > 0
        tags:
            - packages

      - name: Install pipx via apt when a pipx package is selected
        become: true
        ansible.builtin.apt:
            name: pipx
            state: present
        when:
            - (dotfiles_pkgs_pipx | length) > 0
            - "'pipx' not in dotfiles_pkgs_apt | map(attribute='value.package')"
        tags:
            - packages

      - name: Ensure pipx path is configured
        ansible.builtin.command:
            argv: [pipx, ensurepath]
        register: dotfiles_pipx_ensurepath
        # AI-04: pipx prints 'is already in PATH' when nothing changed and
        # 'Success! Added' when it edited a shell file; any non-zero rc is a
        # real failure (no failed_when: false masking). Match stdout+stderr
        # (AI-31) so a future message move does not flip idempotency.
        changed_when: "'already in path' not in ((dotfiles_pipx_ensurepath.stdout | default('')) + (dotfiles_pipx_ensurepath.stderr | default('')) | lower)"
        failed_when: dotfiles_pipx_ensurepath.rc != 0
        when: (dotfiles_pkgs_pipx | length) > 0
        tags:
            - packages

      # -- Per-source installs ------------------------------------------------
      - name: Update APT package metadata
        become: true
        ansible.builtin.apt:
            update_cache: true
            cache_valid_time: 3600
        tags:
            - packages

      # AI-17: one task, one apt transaction for all selected apt packages.
      - name: Install apt packages
        become: true
        ansible.builtin.apt:
            name: "{{ dotfiles_pkgs_apt | map(attribute='value.package') | list }}"
            state: present
        when: (dotfiles_pkgs_apt | length) > 0
        tags:
            - packages

      - name: Install cargo crates
        community.general.cargo:
            name: '{{ item.value.crate }}'
            # AI-26: quotes are REQUIRED (bare {{ }} is a YAML parse error);
            # default(omit, true) also rescues empty-string/falsy values.
            version: '{{ item.value.version | default(omit, true) }}'
            features: '{{ item.value.features | default(omit, true) }}'
            executable: "{{ dotfiles_home }}/.cargo/bin/cargo"
            state: present
        loop: '{{ dotfiles_pkgs_cargo }}'
        loop_control:
            label: '{{ item.value.crate }}'
        environment:
            PATH: "{{ dotfiles_home }}/.cargo/bin:{{ ansible_facts.env.PATH }}"
        tags:
            - packages

      - name: Install global npm packages
        community.general.npm:
            name: '{{ item.value.package }}'
            version: '{{ item.value.version | default(omit, true) }}'
            global: true
            state: present
            # AI-10: resolve node/npm through the fnm-managed default alias.
            executable: "{{ dotfiles_home }}/.local/share/fnm/aliases/default/bin/npm"
        loop: '{{ dotfiles_pkgs_npm }}'
        loop_control:
            label: '{{ item.value.package }}'
        environment:
            PATH: "{{ dotfiles_home }}/.local/share/fnm/aliases/default/bin:{{ dotfiles_home }}/.local/share/fnm:{{ dotfiles_home }}/.local/bin:{{ ansible_facts.env.PATH }}"
        tags:
            - packages

      - name: Install pipx packages
        community.general.pipx:
            name: "{{ item.value.package }}{{ '==' + item.value.version if item.value.version is defined else '' }}"
            state: install
        loop: '{{ dotfiles_pkgs_pipx }}'
        loop_control:
            label: '{{ item.value.package }}'
        environment:
            PATH: "{{ dotfiles_home }}/.local/bin:{{ ansible_facts.env.PATH }}"
        tags:
            - packages

      - name: Run script installers
        ansible.builtin.shell:
            # AI-31: bash (not sh) — the fnm entry expects bash; executable below agrees.
            cmd: "set -o pipefail && curl -fsSL {{ item.value.url | quote }} | bash -s -- {{ item.value.args | default([]) | map('quote') | join(' ') }}"
            executable: /bin/bash
            creates: "{{ item.value.creates | regex_replace('^~/', dotfiles_home + '/') }}"
        loop: '{{ dotfiles_pkgs_script }}'
        loop_control:
            label: '{{ item.key }}'
        environment:
            PATH: "{{ dotfiles_home }}/.local/bin:{{ dotfiles_home }}/.cargo/bin:/usr/local/bin:/usr/bin:/bin"
        tags:
            - packages

      # AI-21: the per-user deb cache dir must exist before get_url writes into it.
      - name: Ensure deb download cache directory exists
        ansible.builtin.file:
            path: "{{ dotfiles_home }}/.cache/dotfiles-debs"
            state: directory
            mode: '0755'
        when: (dotfiles_pkgs_deb | length) > 0
        tags:
            - packages

      - name: Download deb packages
        ansible.builtin.get_url:
            url: '{{ item.value.url }}'
            dest: "{{ dotfiles_home }}/.cache/dotfiles-debs/{{ item.key }}.deb"
            mode: '0644'
        loop: '{{ dotfiles_pkgs_deb }}'
        loop_control:
            label: '{{ item.key }}'
        tags:
            - packages

      - name: Install deb packages
        become: true
        ansible.builtin.apt:
            deb: "{{ dotfiles_home }}/.cache/dotfiles-debs/{{ item.key }}.deb"
        loop: '{{ dotfiles_pkgs_deb }}'
        loop_control:
            label: '{{ item.key }}'
        tags:
            - packages

      - name: Ensure archive parents exist
        ansible.builtin.file:
            path: "{{ item.value.dest | regex_replace('^~/', dotfiles_home + '/') }}"
            state: directory
            mode: '0755'
        loop: '{{ dotfiles_pkgs_archive }}'
        loop_control:
            label: '{{ item.key }}'
        when: (item.value.creates | regex_replace('^~/', dotfiles_home + '/')) != (item.value.dest | regex_replace('^~/', dotfiles_home + '/'))
        tags:
            - packages

      - name: Extract archives
        ansible.builtin.unarchive:
            # AI-23: per-arch URL override (e.g. url_arm64), else the default url.
            src: "{{ item.value['url_' + dotfiles_deb_arch] | default(item.value.url, true) }}"
            dest: "{{ item.value.dest | regex_replace('^~/', dotfiles_home + '/') }}"
            remote_src: true
            creates: "{{ item.value.creates | regex_replace('^~/', dotfiles_home + '/') }}"
            # AI-20/AI-32: strip-components is tar-only; never passed for .zip
            # (case-insensitive, query-string tolerant).
            extra_opts: "{{ ['--strip-components=' + (item.value.strip | string)] if (item.value.strip is defined and item.value.url is not search('(?i)\\.zip($|\\?)')) else [] }}"
        loop: '{{ dotfiles_pkgs_archive }}'
        loop_control:
            label: '{{ item.key }}'
        tags:
            - packages

      # AI-25: ansible.builtin.git has no `creates` param — guard the clone with
      # a stat of the entry's `creates` marker instead (skip_missing-safe via
      # the index-matched register).
      - name: Check git install markers
        ansible.builtin.stat:
            path: "{{ item.value.creates | regex_replace('^~/', dotfiles_home + '/') }}"
        loop: '{{ dotfiles_pkgs_git }}'
        loop_control:
            label: '{{ item.key }}'
            index_var: dotfiles_git_idx
        register: dotfiles_git_marker
        tags:
            - packages

      - name: Clone git sources
        ansible.builtin.git:
            repo: '{{ item.value.repo }}'
            dest: "{{ (item.value.dest | default('~/.local/src/' + item.key)) | regex_replace('^~/', dotfiles_home + '/') }}"
            version: "{{ item.value.version | default(omit, true) }}"
            update: "{{ item.value.version is defined }}"
        loop: '{{ dotfiles_pkgs_git }}'
        loop_control:
            label: '{{ item.key }}'
            index_var: dotfiles_git_idx
        when: not (dotfiles_git_marker.results[dotfiles_git_idx].stat.exists | default(false))
        tags:
            - packages

      - name: Run git build steps
        ansible.builtin.shell: '{{ build_step }}'
        args:
            chdir: "{{ (item.0.value.dest | default('~/.local/src/' + item.0.key)) | regex_replace('^~/', dotfiles_home + '/') }}"
            creates: "{{ (item.1.creates | default(item.0.value.creates, true)) | regex_replace('^~/', dotfiles_home + '/') }}"
        loop: "{{ dotfiles_pkgs_git | subelements('value.build', skip_missing=True) }}"
        loop_control:
            label: '{{ item.0.key }}: {{ item.1.cmd if item.1 is mapping else item.1 }}'
        vars:
            build_step: "{{ item.1.cmd if item.1 is mapping else item.1 }}"
        tags:
            - packages

      # -- Dotfile linking (identical for all profiles) -----------------------
      - name: Ensure user config directory exists
        ansible.builtin.file:
            path: '{{ dotfiles_home }}/.config'
            state: directory
            mode: '0755'
        tags:
            - dotfiles

      - name: Discover direct home entries
        ansible.builtin.find:
            paths: '{{ dotfiles_repo_root }}/home'
            recurse: false
            hidden: true
            file_type: any
        register: home_entries
        tags:
            - dotfiles

      - name: Link direct home entries
        ansible.builtin.include_tasks:
            file: tasks/link.yml
            apply:
                tags:
                    - dotfiles
        loop: '{{ home_entries.files }}'
        loop_control:
            loop_var: dotfile
            label: '{{ dotfile.path | basename }}'
        vars:
            link_source: '{{ dotfile.path }}'
            link_destination: '{{ dotfiles_home }}/{{ dotfile.path | basename }}'
            link_backup_group: home
        tags:
            - dotfiles

      - name: Discover config entries
        ansible.builtin.find:
            paths: '{{ dotfiles_repo_root }}/.config'
            recurse: false
            hidden: true
            file_type: any
        register: config_entries
        tags:
            - dotfiles

      - name: Link config entries
        ansible.builtin.include_tasks:
            file: tasks/link.yml
            apply:
                tags:
                    - dotfiles
        loop: "{{ config_entries.files | rejectattr('path', 'in', dotfiles_config_excludes | map('regex_replace', '^', dotfiles_repo_root + '/.config/') | list) | list }}"
        loop_control:
            loop_var: dotfile
            label: '{{ dotfile.path | basename }}'
        vars:
            link_source: '{{ dotfile.path }}'
            link_destination: '{{ dotfiles_home }}/.config/{{ dotfile.path | basename }}'
            link_backup_group: config
        tags:
            - dotfiles
